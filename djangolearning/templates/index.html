
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <title>Home - My Website</title>
</head>
<body>

    <header class="site-header">
        <a class="site-brand" href="/">My Website</a>
        <button class="site-menu-toggle" type="button" aria-expanded="false" aria-controls="site-menu">Menu</button>
        <nav class="site-menu" id="site-menu" aria-label="Main navigation">
            <a href="/">Home</a>
            <a href="/aboutus/">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main class="site-main">
        <section class="site-hero">
            <div>
                <h1>Welcome to My Website</h1>
                <p>Welcome! We are happy to have you here.</p>
            </div>
            <img class="site-hero-image" src="{% static 'images/profile2.jpg' %}" alt="A member of our team">
        </section>

        <section class="site-panel" id="services">
            <h2>Our Mission</h2>
            <p>Our mission is to provide quality services to our customers.</p>
            <img class="site-card-image" src="{% static 'images/safti-site.jpg' %}" alt="Website design project">
        </section>

        <section class="site-panel" id="contact">
            <h2>Get in touch</h2>
            <p>Visit our <a href="/aboutus/">About page</a> to learn more about us.</p>
        </section>
    </main>

    <footer class="site-footer">© <span data-current-year></span> My Website</footer>
    <script src="{% static 'js/site.js' %}" defer></script>
</body>
</html>
