{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{% block meta_description %}Advards Model College supports academic growth, strong character, and lifelong learning.{% endblock %}">
    <title>{% block title %}Advards Model College{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="college-site">
    {% include "header.html" %}
    <main class="page-main">
        {% block content %}{% endblock %}
    </main>
    {% include "footer.html" %}
    <script src="{% static 'js/site.js' %}" defer></script>
</body>
</html>
