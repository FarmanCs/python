{% extends "base.html" %}
{% block content %}
  <h1>User Form</h1>
  <div class="user-form">
    <form method="post">
      {% csrf_token %}
      <p>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" value="{{ name }}" required>
      </p>
      <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" value="{{ email }}" required>
      </p>
      <button type="submit">Submit</button>
    </form>
  </div>
{% endblock content %}
