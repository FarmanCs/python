{% load static %}
<div class="topbar">
    <div class="container topbar-inner">
        <span>Learning with purpose. Leading with confidence.</span>
        <a href="{% url 'contact' %}">Admissions enquiries <span aria-hidden="true">→</span></a>
    </div>
</div>
<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="{% url 'root' %}" aria-label="Advards Model College home">
            <span class="brand-mark" aria-hidden="true">A</span>
            <span class="brand-text"><strong>ADVARDS</strong><small>MODEL COLLEGE</small></span>
        </a>
        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="primary-navigation">
            <span class="nav-toggle-icon" aria-hidden="true"></span>
            <span class="sr-only">Toggle navigation</span>
        </button>
        <nav class="main-nav" id="primary-navigation" aria-label="Main navigation">
            <a href="{% url 'root' %}" {% if request.resolver_match.url_name == 'root' or request.resolver_match.url_name == 'homepage' %}aria-current="page"{% endif %}>Home</a>
            <a href="{% url 'aboutus' %}" {% if request.resolver_match.url_name == 'aboutus' %}aria-current="page"{% endif %}>About</a>
            <a href="{% url 'services' %}" {% if request.resolver_match.url_name == 'services' %}aria-current="page"{% endif %}>Programs</a>
            <a class="nav-contact" href="{% url 'contact' %}" {% if request.resolver_match.url_name == 'contact' %}aria-current="page"{% endif %}>Contact us <span aria-hidden="true">↗</span></a>
        </nav>
    </div>
</header>
